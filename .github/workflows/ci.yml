name: CI Pipeline - Task Automation Agent

on:
  push:
    branches: [ main, master, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Lint, and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and bytecode compilation check
        run: |
          python -m py_compile config.py agent.py app.py

      - name: Run deterministic unit test suite with pytest
        run: |
          pytest -v --tb=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker container image (zero-secret build)
        run: |
          docker build -t experiment-10-agent:ci .

      - name: Inspect generated Docker image
        run: |
          docker images experiment-10-agent:ci
